<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Fleet Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style id="app-css">:root{
  color-scheme: light;
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E8EBF0; --glass:rgba(255,255,255,.78);
  --ink:#0D1421; --ink-2:#2A3342; --muted:#5E6878; --faint:#8C95A3;
  --line:#E6E9EE; --line-strong:#D3D8E0;
  --accent:#2B59C3; --accent-hover:#2149A8; --accent-soft:#EBF0FC; --accent-ink:#FFFFFF;
  --amber:#F5A524; --amber-soft:#FFF4DE; --amber-ink:#4D3200;
  --good:#0B8F63; --good-soft:#E2F5EC; --warn:#A8690F; --warn-soft:#FDF1DC; --bad:#D92D20; --bad-soft:#FDECEA;
  --illo-a:#EDF1F7; --illo-b:#F8FAFC; --illo-floor:#E6EAF1; --illo-glass-a:#2E3E55; --illo-glass-b:#5E7391;
  --sh-1:0 1px 2px rgba(13,20,33,.05);
  --sh-2:0 6px 16px -4px rgba(13,20,33,.10),0 2px 4px -2px rgba(13,20,33,.06);
  --sh-3:0 24px 48px -16px rgba(13,20,33,.22);
  --r:18px; --r-md:12px; --r-sm:9px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-app-theme="dark"]{
  color-scheme: dark;
  --bg:#0B0F16; --surface:#131923; --surface-2:#1A212D; --surface-3:#222B39; --glass:rgba(19,25,35,.78);
  --ink:#EEF2F8; --ink-2:#CDD5E1; --muted:#9AA5B5; --faint:#6D7889;
  --line:#232C3A; --line-strong:#313C4D;
  --accent:#86A8FF; --accent-hover:#A3BDFF; --accent-soft:#1C2842; --accent-ink:#0B0F16;
  --amber:#F7B84B; --amber-soft:#3A2D12; --amber-ink:#241800;
  --good:#4FCB98; --good-soft:#12301F; --warn:#E6A94E; --warn-soft:#352812; --bad:#FF8A80; --bad-soft:#3A1C1A;
  --illo-a:#1A2230; --illo-b:#141B26; --illo-floor:#1E2735; --illo-glass-a:#0E1520; --illo-glass-b:#33455E;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 8px 20px -6px rgba(0,0,0,.45);
  --sh-3:0 24px 48px -16px rgba(0,0,0,.6);
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12.5px;color:var(--faint)}
.spacer{margin-right:auto}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes drawer{from{transform:translateX(-100%)}to{transform:none}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.anim-view{animation:fadeUp .42s var(--ease) both}
.anim-cards .card{animation:fadeUp .45s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
.pop svg{animation:pop .35s var(--ease)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-hover));color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--sh-2)}
.brand-name{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:999px;padding:4px}
.nav a{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;transition:background .2s,color .2s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.nav .count{font-family:var(--f-mono);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--amber-ink);display:inline-grid;place-items:center;font-weight:600}
.nav a.admin-link{color:var(--accent)}
.theme-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:color .2s,transform .3s var(--ease)}
.theme-btn:hover{color:var(--ink);transform:rotate(-15deg)}

/* ---------- hero ---------- */
.hero{position:relative;padding-block:44px 8px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(38% 70% at 78% 30%,var(--accent-soft),transparent);z-index:-1;pointer-events:none}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:19ch;font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{color:var(--muted);font-size:17px;margin:12px 0 0;max-width:56ch}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.bigsearch{position:relative;margin-top:26px;max-width:720px}
.bigsearch input{width:100%;height:56px;padding:0 20px 0 52px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:16px;box-shadow:var(--sh-2);transition:border-color .2s,box-shadow .2s}
.bigsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--sh-2)}
.bigsearch svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* ---------- type rail ---------- */
.rail{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none;scroll-snap-type:x proximity;mask-image:linear-gradient(90deg,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;text-align:left;padding:5px 12px 5px 5px;transition:border-color .2s,box-shadow .2s,background .2s}
.tile:hover{border-color:var(--line-strong);box-shadow:var(--sh-1)}
.tile[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.tile[data-zero]{opacity:.5}
.tile .ti{display:grid;place-items:center;width:52px;height:34px;border-radius:8px;background:var(--surface-2);overflow:hidden;flex:0 0 auto;color:var(--muted)}
.tile .ti svg{width:100%;height:100%;display:block}
.tile.all .ti svg{width:18px;height:18px}
.tile .tt{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.tile .t{font-weight:600;font-size:13.5px}
.tile .n{font-size:12px;color:var(--faint);font-family:var(--f-mono)}
.tile[aria-pressed="true"] .n{color:inherit;opacity:.6}
.tile[aria-pressed="true"] .ti{background:color-mix(in srgb,var(--surface) 90%,transparent)}
.subcats{display:flex;gap:6px;flex-wrap:wrap;padding-block:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink);transition:all .2s}
.chip:hover{border-color:var(--line-strong);background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .n{color:var(--faint);font-family:var(--f-mono);font-size:11.5px}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.65}

/* ---------- browse ---------- */
.browse{display:grid;grid-template-columns:252px minmax(0,1fr);gap:28px;padding-block:18px 130px}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,64px) + 14px);align-self:start;max-height:calc(100vh - var(--hdr,64px) - 28px);overflow:auto;padding:4px 8px 16px 2px;scrollbar-width:thin}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fhead h2{font-size:17px;margin-right:auto}
.fgroup{border-top:1px solid var(--line);padding-block:13px}
.fgroup>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary .fc{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px;line-height:17px}
.fgroup>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:transform .25s var(--ease)}
.fgroup[open]>summary::after{transform:rotate(-135deg)}
.fgroup .fbody{padding-top:10px;display:grid;gap:3px}
.fgroup[open] .fbody{animation:fadeIn .25s ease}
.fsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:18px 0 2px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;padding:3px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.check .n{margin-left:auto;color:var(--faint);font-family:var(--f-mono);font-size:12px}
.check.zero{color:var(--faint)}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.range input{width:100%;min-width:0}
.range span{color:var(--faint)}
.input{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;font-size:14px;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;min-height:38px}
.toolbar .cnt{font-weight:600;font-size:14.5px}
.toolbar .cnt b{font-family:var(--f-mono);font-weight:500}
.toolbar select.input{padding-block:6px;border-radius:999px;padding-inline:12px;font-size:13.5px}
.sortsel{display:inline-flex;align-items:center;gap:8px}
.activebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.resultline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:32px;flex:1}
.resultline .cnt{font-weight:600}
.resultline .cnt b{font-family:var(--f-mono);font-weight:500}
.active-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:4px 8px 4px 11px;font-size:13px;font-weight:500;cursor:pointer;animation:fadeIn .2s ease}
.active-chip:hover{filter:brightness(.97)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s,box-shadow .2s}
.btn:hover{border-color:var(--ink-2);box-shadow:var(--sh-1)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2);box-shadow:none}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--surface)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-soft)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:500}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);transition:all .2s}
.iconbtn:hover{color:var(--ink);border-color:var(--line-strong)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--line-strong)}
.media{position:relative;aspect-ratio:2/1;background:var(--surface-2);overflow:hidden}
.media>svg,.media>img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .media>svg,.card:hover .media>img{transform:scale(1.02)}
.media .tag{position:absolute;left:12px;bottom:10px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:6px;padding:2px 7px}
.media .count-tag{position:absolute;right:12px;bottom:10px;font-size:11.5px;font-family:var(--f-mono);color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 7px}
.ov{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:2;pointer-events:none}
.ov>*{pointer-events:auto}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ov .status{font-size:11.5px;padding:3px 9px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--sh-1)}
.status.on-sale{color:var(--good)} .status.orders-open{color:var(--accent)} .status.announced{color:var(--warn)} .status.discontinued{color:var(--muted)}
.body-status .status.on-sale{background:var(--good-soft)} .body-status .status.orders-open{background:var(--accent-soft)} .body-status .status.announced{background:var(--warn-soft)} .body-status .status.discontinued{background:var(--surface-2)}
.savebtn{margin-left:auto;width:34px;height:34px;border-radius:999px;border:0;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);box-shadow:var(--sh-1);transition:transform .2s var(--ease),background .2s}
.savebtn:hover{transform:scale(1.08)}
.savebtn[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.ctitle{display:flex;gap:10px;align-items:flex-start}
.ctitle>div{min-width:0;flex:1}
.ccat{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{font-size:17px;margin-top:2px;letter-spacing:-.01em}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.card h3 a:focus-visible{outline:none}
.card:has(h3 a:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.cbrand{font-size:13px;color:var(--muted)}
.lic{flex:0 0 auto;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 7px;border-radius:9px;background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);line-height:1}
.lic small{display:block;font-family:var(--f-body);font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-top:1px}
.lic.tall{height:40px}
.specs{display:grid;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0}
.spec{padding:0 10px;min-width:0}
.spec:first-child{padding-left:0}
.spec+.spec{border-left:1px solid var(--line)}
.spec .v{font-family:var(--f-mono);font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.spec .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.spec .v.na{color:var(--faint)}
.spec .k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfoot{display:flex;align-items:center;gap:8px;margin-top:auto}
.price{font-family:var(--f-mono);font-size:13.5px;white-space:nowrap;margin-right:auto}
.price b{font-weight:500;color:var(--ink)}
.price.na{color:var(--faint);font-family:var(--f-body)}
.cmptoggle{position:relative;z-index:2;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2);transition:all .2s}
.cmptoggle .box{width:16px;height:16px;border-radius:5px;border:1.6px solid var(--line-strong);display:grid;place-items:center;transition:all .2s}
.cmptoggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.cmptoggle[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty h3{font-size:22px;color:var(--ink);margin-bottom:6px}

/* ---------- tray / toast ---------- */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);border-radius:999px;padding:7px 7px 7px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-3);max-width:calc(100% - 32px)}
.tray.in{animation:rise .4s var(--ease) both}
.tray.lift{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tray .slots{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tray .slot{display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--surface) 14%,transparent);border-radius:999px;padding:4px 5px 4px 11px;font-size:13px;white-space:nowrap}
.tray .slot button{background:none;border:0;color:inherit;opacity:.7;cursor:pointer;display:grid;place-items:center;padding:2px}
.tray .lbl{font-size:12.5px;opacity:.7;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:14px;box-shadow:var(--sh-3);max-width:calc(100% - 32px);animation:rise .35s var(--ease) both}

/* ---------- vehicle page ---------- */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:22px 18px;font-size:13.5px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.crumbs button:hover{color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.vp-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:36px;align-items:start}
.gallery{display:grid;gap:12px}
.g-main{position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:var(--surface-2);box-shadow:var(--sh-2)}
.g-main>svg,.g-main>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:fadeIn .4s ease}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:999px;border:0;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:var(--sh-2);transition:transform .2s var(--ease)}
.g-nav:hover{transform:translateY(-50%) scale(1.08)}
.g-nav.prev{left:14px}.g-nav.next{right:14px}
.g-count{position:absolute;right:14px;bottom:12px;font-family:var(--f-mono);font-size:12px;color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:3px 9px}
.g-credit{font-size:12px;color:var(--faint);margin-top:-4px}
.thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.thumb{flex:0 0 auto;width:92px;aspect-ratio:16/10;border-radius:11px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2);cursor:pointer;opacity:.7;transition:all .2s}
.thumb:hover{opacity:1}
.thumb[aria-current="true"]{border-color:var(--accent);opacity:1}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.vp-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vp-sum{color:var(--ink-2);font-size:16px;margin:0;max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ktile{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.ktile .k{font-size:12.5px;color:var(--muted)}
.ktile .v{font-family:var(--f-mono);font-size:19px;font-weight:500;letter-spacing:-.03em;line-height:1.2}
.ktile .v small{font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
.ktile .v.na{color:var(--faint);font-size:14px;padding-top:4px}
.vp-price{display:flex;align-items:baseline;gap:8px}
.vp-price b{font-family:var(--f-mono);font-size:21px;font-weight:500}
.vp-actions{display:flex;gap:10px;flex-wrap:wrap}
.section{padding-block:52px 0}
.section>h2{font-size:22px;margin-bottom:16px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.sgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.sgroup h3{font-size:16px;font-family:var(--f-body);font-weight:600;margin-bottom:8px}
.sgroup dl{margin:0;display:grid}
.sgroup .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.sgroup .row:first-child{border-top:0}
.sgroup dt{color:var(--muted);font-size:14px}
.sgroup dt .hint{display:block}
.sgroup dd{margin:0;font-family:var(--f-mono);font-size:14px;text-align:right;max-width:24ch}
.sgroup dt{min-width:0}
.notice{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px;margin-top:18px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,300px);gap:18px;overflow-x:auto;padding:4px 4px 24px;margin:-4px -4px 0;scroll-snap-type:x proximity;scrollbar-width:thin}
.hscroll .card{scroll-snap-align:start}

/* ---------- compare / saved ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:40px 20px}
.page-head h1{font-size:clamp(32px,4vw,46px);font-weight:700}
.page-head p{margin:6px 0 0;color:var(--muted)}
.cmp-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:130px;box-shadow:var(--sh-1)}
.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:680px}
.cmp th,.cmp td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{vertical-align:bottom;background:var(--surface)}
.cmp tbody th{font-weight:500;color:var(--muted);font-size:13.5px;width:200px;position:sticky;left:0;background:var(--surface);z-index:1}
.cmp td{font-family:var(--f-mono);font-size:14px;min-width:180px}
.cmp td.best{color:var(--good);font-weight:600}
.cmp td.best .badge{display:inline-block;font-family:var(--f-body);font-size:10.5px;font-weight:600;letter-spacing:.04em;background:var(--good-soft);color:var(--good);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.cmp tr.grp th,.cmp tr.grp td{background:var(--surface-2);color:var(--ink);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding-block:8px}
.cmp tr.same td{color:var(--muted)}
.cmp .vh{display:grid;gap:8px}
.cmp .vh .m{aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.cmp .vh .m svg,.cmp .vh .m img{width:100%;height:100%;object-fit:cover;display:block}
.cmp .vh h3{font-size:18px}
.cmp .vh h3 button{all:unset;cursor:pointer}
.cmp .vh h3 button:hover{color:var(--accent)}
.cmp .vh .b{font-size:13px;color:var(--muted);font-family:var(--f-body)}
.cmp .vh .acts{display:flex;gap:6px}
.bar{height:4px;border-radius:2px;background:var(--surface-3);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transform-origin:left;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
td.best .bar i{background:var(--good)}
.ss-list{display:grid;gap:10px;margin-bottom:34px}
.ss{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;flex-wrap:wrap;transition:box-shadow .2s}
.ss:hover{box-shadow:var(--sh-2)}
.ss .name{font-weight:600}
.ss .desc{font-size:13px;color:var(--muted);flex:1 1 200px}
.section-title{font-size:22px;margin:4px 0 14px}

/* ---------- admin ---------- */
.admin{padding-bottom:150px}
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:20px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 15px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:999px;white-space:nowrap;transition:all .2s}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:var(--sh-1)}
.tabs .n{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-left:5px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter .track{width:140px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--accent)}
.meter.warn .track i{background:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .muted{color:var(--muted)}
.tbl .actions{text-align:right;white-space:nowrap}
.tbl .thumbcell{width:72px}
.tbl .thumbcell span{display:block;width:64px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.tbl .thumbcell svg,.tbl .thumbcell img{width:100%;height:100%;object-fit:cover;display:block}
.adm-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1 1 240px}
.search input{width:100%;padding:9px 14px 9px 40px;border-radius:999px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.form{display:grid;gap:20px;padding:22px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field label,.field .lbl{font-size:13px;font-weight:600}
.field .hint{font-weight:400}
.field .input{width:100%}
.field.wide{grid-column:1/-1}
.unit-in{display:flex;align-items:stretch}
.unit-in .input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0;flex:1}
.unit-in span{border:1px solid var(--line-strong);border-left:0;border-radius:0 var(--r-sm) var(--r-sm) 0;padding:8px 10px;background:var(--surface-2);color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.checks{display:flex;flex-wrap:wrap;gap:4px 16px}
.form h3{font-size:18px;border-top:1px solid var(--line);padding-top:18px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dropzone{display:grid;place-items:center;gap:6px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:var(--r-md);padding:22px;color:var(--muted);cursor:pointer;transition:all .2s;background:var(--surface-2)}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dropzone input{position:absolute;width:1px;height:1px;opacity:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.photo{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);animation:fadeUp .3s var(--ease) both}
.photo .pi{position:relative;aspect-ratio:16/10;background:var(--surface-2)}
.photo .pi img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pi .cover{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px}
.photo .pb{padding:8px;display:grid;gap:6px}
.photo .pb .input{font-size:12.5px;padding:6px 9px}
.photo .pa{display:flex;gap:4px;align-items:center}
.photo .pa .iconbtn{width:30px;height:30px}
.tree{list-style:none;margin:0;padding:0}
.tree li{border-bottom:1px solid var(--line)}
.tree li:last-child{border-bottom:0}
.tree .row{display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.tree .row.child{padding-left:50px;position:relative}
.tree .row.child::before{content:"";position:absolute;left:28px;top:0;height:50%;width:12px;border-left:1.5px solid var(--line-strong);border-bottom:1.5px solid var(--line-strong);border-bottom-left-radius:6px}
.tree .row .input{flex:1 1 200px}
.tree .row .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:76px}
.tree .row select.input{flex:0 0 130px}
.tree .ti{width:64px;height:36px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.tree .ti svg{width:100%;height:100%;display:block}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:var(--r-sm);padding:9px 12px;margin:0 14px 12px;font-size:13.5px;animation:fadeIn .2s ease}
.confirm select{max-width:240px}
.attr{padding:14px 16px;border-bottom:1px solid var(--line)}
.attr:last-child{border-bottom:0}
.attr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.attr-head .t{font-weight:600}
.attr-head .type{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:6px}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.attr .form{animation:fadeIn .25s ease}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 11px;font-size:13px;background:var(--surface-2)}
.opt input{border:0;background:transparent;width:auto;min-width:40px;field-sizing:content;padding:2px 0;font-size:13px}
.opt input:focus{outline:none}
.opt button{border:0;background:none;color:var(--faint);cursor:pointer;padding:3px;display:grid;place-items:center;border-radius:999px}
.opt button:hover{color:var(--bad)}
.data-card{padding:22px;display:grid;gap:12px}
.data-card p{margin:0;color:var(--muted);max-width:68ch}
.data-card textarea{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12.5px}
.draftbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:min(880px,calc(100% - 32px));background:var(--amber);color:var(--amber-ink);border-radius:18px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--sh-3)}
.draftbar.in{animation:rise .4s var(--ease) both}
.draftbar .msg{flex:1 1 260px;font-size:14px}
.draftbar .btn{border-color:rgba(0,0,0,.2);background:rgba(255,255,255,.55);color:var(--amber-ink)}
.draftbar .btn.dark{background:#1A1300;color:#FFE3A8;border-color:#1A1300}
.admin-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r-md);padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.filters-toggle{display:none}
.foot{border-top:1px solid var(--line);padding-block:22px;color:var(--faint);font-size:12.5px;margin-top:20px}

@media (max-width:900px){
  .browse{grid-template-columns:1fr}
  .filters{position:fixed;inset:0 auto 0 0;align-self:stretch;height:100dvh;width:min(340px,88vw);max-height:none;overscroll-behavior:contain;background:var(--surface);z-index:50;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 28px;box-shadow:var(--sh-3);transform:translateX(-105%)}
  .filters.open{transform:none}
  .filters.open.slide{animation:drawer .3s var(--ease)}
  .filters-toggle{display:inline-flex}
  .scrim{position:fixed;inset:0;background:rgba(8,12,20,.4);z-index:49;animation:fadeIn .25s ease}
}
@media (max-width:600px){
  .wrap,.top-in{padding-inline:16px}
  .brand-sub{display:none}
  .hero{padding-top:28px}
  .stats{gap:18px}
  .stat b{font-size:18px}
  .tray .lbl{display:none}
  .sheet{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
/* ---------- applications ---------- */
.railhead{display:flex;align-items:center;gap:12px;padding-top:28px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:7px 15px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer;transition:all .2s}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.railhead+.rail{padding-top:14px}
.apps{display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden;min-height:24px}
.appchip{position:relative;z-index:2;flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500;line-height:1;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
button.appchip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.appchip.more{flex:0 0 auto;cursor:default;color:var(--muted);background:var(--surface-2);border-color:transparent}
.vp-apps{display:grid;gap:8px}
.vp-apps .apps{flex-wrap:wrap;overflow:visible}
.vp-apps .appchip{font-size:13px;padding:7px 12px}
.fsub{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 2px}
.fsub:first-child{margin-top:0}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 20px}
.appcol{display:grid;gap:2px;align-content:start}
.appcol .lbl{font-size:13px;font-weight:600;margin-bottom:4px}
/* ---------- variants ---------- */
.vtag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.spec .v.rng{font-size:13.5px}
.vmatch{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--good);background:var(--good-soft);border-radius:8px;padding:5px 9px;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmatch svg{flex:0 0 auto}
.vpick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:12px}
.vhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vname{font-weight:600}
.vrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center}
.vlab{font-size:13px;color:var(--muted)}
.vopts{display:flex;flex-wrap:wrap;gap:6px}
.vopt{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:6px 12px;font-family:var(--f-mono);font-size:13.5px;cursor:pointer;color:var(--ink);transition:all .2s var(--ease)}
.vopt:hover{border-color:var(--ink-2)}
.vopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.vopt.alt{border-style:dashed;color:var(--muted)}
.vtbl tr.on td{background:var(--accent-soft)}
.vtbl tbody tr{cursor:default}
.ktile .v{transition:color .2s}
.shared-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r-md);padding:10px 14px;font-size:13.5px;color:var(--ink-2)}
.shared-note svg{color:var(--accent);margin-top:3px;flex:0 0 auto}
.vgrid-wrap{border:1px solid var(--line);border-radius:var(--r-md)}
.vgrid td{padding:6px 8px}
.vgrid .input{padding:6px 8px;font-size:13px;min-width:92px;width:100%}
.vgrid td:nth-child(2) .input{min-width:160px}
.vgrid td.inh .input{background:var(--surface-2);border-color:var(--line)}
.vgrid td.own .input{border-color:var(--accent);background:var(--surface)}
.vgrid .iconbtn{width:30px;height:30px}
.vsel-cmp{font-size:13px;padding:6px 8px;font-family:var(--f-body)}
@media (max-width:600px){.vrow{grid-template-columns:1fr;gap:6px}}
.cmp .vh .m{max-width:260px}
/* ---------- versions ---------- */
.famvars{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;z-index:2}
.famvars .lbl{width:100%;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.famvar{font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;font-family:var(--f-mono);transition:all .2s}
.famvar:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.vp-vers{display:grid;gap:8px}
.vers{display:flex;flex-wrap:wrap;gap:6px}
.verbtn{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:7px 12px;font-family:var(--f-mono);font-size:13.5px;cursor:pointer;color:var(--ink);transition:all .2s var(--ease)}
.verbtn:hover{border-color:var(--ink-2)}
.verbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .25s var(--ease)}
.switch input:checked+.track{background:var(--accent)}

.cmp.cols-4 td,.cmp.cols-4 thead th:not(.corner){width:20%}

  .cmp thead th.corner{z-index:5}
  .cmp thead th:first-child{border-top-left-radius:var(--r)}
  .cmp thead th:last-child{border-top-right-radius:var(--r)}
}
@media (max-width:600px){
  .cmp tbody th{width:120px;min-width:120px;font-size:12.5px}
  .cmp td{min-width:160px}
  .cmp-tools select{max-width:none;flex:1}
}

// rows shared by the table, CSV and copy: [{group, label, cells:[{text, raw, na}], same, attr}]
function compareRows(entries) {
  const items = entries.map(e => e.l), rows = [];
  const push = (group, label, cells, attr) => { const t = cells.map(c => c.text); rows.push({ group, label, cells, attr, same: t.every(x => x === t[0]) }); };
  push('Overview', 'Vehicle type', items.map(l => ({ text: catPath(l.categoryId), small: true })));
  push('Overview', 'Availability', items.map(l => ({ text: statusLabel(l.status), small: true })));
  push('Overview', 'Used for', items.map(l => ({ text: listingApps(l).map(a => a.name).join(', ') || '—', small: true })));
  push('Overview', 'Data source', items.map(l => ({ text: isConfirmed(l) ? 'Confirmed by ' + l.brand + ' (' + fmtDate(l.verifiedAt) + ')' : 'Public sources', small: true, good: isConfirmed(l) })));
  attrsSorted().filter(a => a.compare).forEach(a => {
    const ap = items.map(l => applies(a, l.categoryId));
    if (!ap.some(Boolean)) return;
    const raw = entries.map(e => effVals(e.l, e.v)[a.id]);
    const cells = raw.map((v, i) => { const t = fmtVal(a, v); return !ap[i] && t == null ? { text: 'n/a', na: 'dna' } : t == null ? { text: '—', na: 'np' } : { text: t, raw: v }; });
    if (cells.every(c => c.na)) return;
    push(a.group || 'Other', a.name, cells, a);
  });

}
function compareTable(entries) {
  const rows = compareRows(entries);
  let out = '', group = null;
  rows.forEach(r => {
    if (S.diffOnly && r.same) return;
    if (r.group !== group) { out += `<tr class="grp"><th scope="rowgroup">${esc(r.group)}</th>${entries.map(() => '<td></td>').join('')}</tr>`; group = r.group; }
    const a = r.attr;
    let best = null, max = null;
    if (a && a.type === 'number') {
      const nums = r.cells.map(c => c.raw).filter(v => typeof v === 'number');
      max = nums.length ? Math.max(...nums) : null;
      if (a.better && nums.length >= 2 && !nums.every(v => v === nums[0])) best = a.better === 'low' ? Math.min(...nums) : max;
    }
    out += `<tr class="${r.same ? 'same' : ''}"><th scope="row">${esc(r.label)}</th>${r.cells.map(c => {
      const isBest = best != null && c.raw === best;
      const bar = a && a.type === 'number' && typeof c.raw === 'number' && max > 0 && a.id !== 'price_eur' ? `<div class="bar"><i style="width:${Math.round(c.raw / max * 100)}%"></i></div>` : '';
      const txt = c.na === 'dna' ? '<span class="na" title="Doesn’t apply to this vehicle type">n/a</span>' : c.na ? '<span class="na" title="Not published">—</span>' : esc(c.text);
      return `<td class="${isBest ? 'best' : ''}${c.small ? ' txt' : ''}${c.good ? ' good' : ''}">${txt}${isBest ? '<span class="badge">Best</span>' : ''}${bar}</td>`;
    }).join('')}</tr>`;
  });

}

function compressImage(file, maxW, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxW / img.naturalWidth);
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      let d = c.toDataURL('image/webp', q); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', q);
      URL.revokeObjectURL(url); res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unreadable')); };
    img.src = url;
  });
}
async function addPhotos(files) {
  if (!S.editBuf) return;

  const st = document.getElementById('img-status'); if (st) { st.hidden = false; st.textContent = `Processing ${list.length} photo${list.length > 1 ? 's' : ''}…`; }
  let failed = 0;
  for (const f of list) {
    try { const src = await compressImage(f, 1600, 0.8); S.editBuf.images = S.editBuf.images || []; S.editBuf.images.push({ src, alt: vehLabel(S.editBuf).trim(), credit: '' }); }
    catch (e) { failed++; }
  }
  render();
  if (failed) toast(`${failed} file${failed > 1 ? 's' : ''} couldn’t be read as an image.`);
}
function moveInList(list, id, dir) {
  const arr = list.slice().sort((a, b) => a.order - b.order);
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];

async function publish() {
  if (!S.dirty || S.publishing) return;
  let art = null;
  try { art = window.claude && window.claude.use ? await window.claude.use('artifact') : null; } catch (e) { }

  } catch (e) {
    S.publishing = false; await persistDraft();

    else if (['not_writer', 'not_granted', 'capability_disabled', 'consent_required', 'not_declared'].includes(c)) toast('This view is read-only, so changes can’t be published from here.');
    else if (c === 'rate_limited') toast('Publishing too often. Wait a minute and try again.');
