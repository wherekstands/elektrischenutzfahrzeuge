name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  app:
    name: Migrations, integration, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecvbase
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecvbase
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
      # Same path as production: schema comes from src/migrations, never from `push`.
      PAYLOAD_DB_PUSH: 'false'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Build as if indexable so robots.txt and meta robots are tested in their production form.
      ALLOW_INDEXING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Seed admin, also used by the e2e publish test.
      SEED_ADMIN_EMAIL: ci-admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations apply to an empty database
        run: pnpm migrate
      - name: Schema matches the migrations
        run: |
          pnpm payload migrate:create --skip-empty ci-drift-check
          if git status --porcelain src/migrations | grep -q .; then
            echo "::error::Collections changed without a migration. Run 'pnpm migrate:create <name>' and commit it."
            git status --porcelain src/migrations
            exit 1
          fi
      - name: Integration tests (partner portal rules)
        run: pnpm test:int
      - name: Seed demo data
        run: pnpm seed:demo
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
